# Netlify configuration for the Next.js frontend (static export).
#
# This repository is a monorepo: the Next.js app lives in ./frontend and there is
# no package.json at the repo root, so `base = "frontend"` is required for both
# dependency installation and the build command.
#
# Netlify looks for netlify.toml in this order:
#   1. package directory   2. base directory   3. repository root
# The Netlify UI must therefore not point the "Package directory" at another
# folder; leaving it empty makes this file the single source of truth.
# Note: settings in this file OVERRIDE the matching settings in the Netlify UI.
#
# `frontend/next.config.ts` sets `output: "export"`, so `next build` emits plain
# static HTML into ./frontend/out and Netlify publishes it with no Node/SSR
# runtime in front of it.
#
# UI equivalents for reference:
#   Base directory:     frontend
#   Package directory:  (leave empty)
#   Build command:      npm run build
#   Publish directory:  out

# This is a monorepo: the Next.js app lives in ./frontend (there is no
# package.json at the repo root), so we set `base = "frontend"`.
# Docs: https://docs.netlify.com/build/configure-builds/file-based-configuration/
#
# Values here OVERRIDE the Netlify UI build settings.

[build]
  base = "frontend"
  command = "npm run build"
  # Next.js static export output (`out/index.html`, `out/login/index.html`, ...).
  # The path is relative to `base`, so this resolves to <repo>/frontend/out.
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# SPA-style fallback is NOT needed: `output: "export"` + `trailingSlash: true`
# writes a real index.html for every route, and Next.js writes out/404.html,
# which Netlify serves automatically for unknown paths.
#
# Security headers applied to every deploy (static hosting, so headers are the
# only hardening layer at the edge).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Next.js hashes its static asset filenames, so they can be cached forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
