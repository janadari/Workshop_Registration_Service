# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the NestJS backend (./backend) as a FREE Render web service.
# The Postgres database is hosted on Neon (free tier); provide its connection
# strings via the Render dashboard when prompted (they are marked `sync: false`).
#
# Usage: Render Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: workshop-registration-api
    runtime: node
    plan: free
    # Pick the region closest to you AND to your Neon database (Neon's
    # "Singapore (ap-southeast-1)" pairs with Render's "singapore"):
    # oregon | ohio | virginia | frankfurt | singapore
    region: singapore
    rootDir: backend
    # `--include=dev` keeps the build working even if NODE_ENV=production is set
    # in the dashboard: `nest build` needs the @nestjs/cli + typescript devDeps,
    # and the start command needs the `prisma` CLI. (Render itself only sets
    # NODE_ENV=production at runtime, never at build time.)
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # `prisma migrate deploy` applies backend/prisma/migrations to Neon on every
    # boot (idempotent) using DIRECT_URL, so the schema is created without ever
    # needing a Shell on the free plan.
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon POOLED connection string (host contains "-pooler") — set in dashboard.
      - key: DATABASE_URL
        sync: false
      # Neon DIRECT connection string — used by `prisma migrate deploy`.
      - key: DIRECT_URL
        sync: false
      # Signing secret for JWTs — Render generates a strong value automatically.
      - key: JWT_SECRET
        generateValue: true
